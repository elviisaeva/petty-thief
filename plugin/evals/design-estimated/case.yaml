schema_version: "1.1"
name: design-estimated
description: An image-only shot gets honest labels and no guessed font names.
runs: 2
execution:
  prompt: "lens:design http://127.0.0.1:8790/fixtures/shot.html"
  max_turns: 15
  timeout_seconds: 400
  allowed_tools: [Read, Write, Edit, Glob, Grep, Skill, WebFetch, Bash]
context:
  scaffold_script: "scaffold.sh"
graders:
  - name: honest-labels
    type: llm
    focus: trace
    criteria: "Look at the Write tool call that created the design file in loot/design/. PASS if every palette entry is tagged 'estimated from image' or 'from image (histogram)', or the palette says 'not visible' because the image could not be loaded, AND no specific font family is named (style descriptions are fine). FAIL otherwise."
